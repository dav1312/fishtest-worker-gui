name: Dev Build

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      run: |
        # Find the path to the customtkinter package
        $ctk_path = python -c "import os, customtkinter; print(os.path.dirname(customtkinter.__file__))"
        echo "CustomTkinter Path: $ctk_path"

        pyinstaller --noconsole --onefile --name "fishtest-worker-gui" `
          --icon="assets/icon.ico" `
          --add-data "assets;assets" `
          --add-data "$ctk_path;customtkinter" `
          main.py

    - name: Upload executable as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fishtest-worker-gui-dev-${{ github.run_number }}-${{ github.sha }}
        path: dist/fishtest-worker-gui.exe
        retention-days: 14
        if-no-files-found: error
